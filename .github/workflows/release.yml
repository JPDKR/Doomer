name: Release

# Push a tag like "v1.1.0" to publish a GitHub release with the installer attached.
# Installed copies of Doomer check the latest release on startup and offer to update.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh -File installer/publish.ps1 -Configuration Release -Version $("${{ github.ref_name }}".TrimStart('v'))

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/DoomerSetup-*.exe
          generate_release_notes: true
